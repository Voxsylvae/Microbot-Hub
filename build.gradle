plugins {
    id 'application'
    id 'java'
    id 'io.freefair.lombok' version '8.6'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import groovy.json.JsonOutput

apply from: 'gradle/project-config.gradle'
apply from: 'gradle/plugin-utils.gradle'

// Load local configuration if it exists (but allow command line to override)
def localProps = new Properties()
if (file('local.properties').exists()) {
    localProps.load(file('local.properties').newDataInputStream())
    localProps.each { key, value ->
        // Only set if not already set via command line
        if (!project.hasProperty(key)) {
            project.ext.set(key, value)
        }
    }
}

// Java toolchain configuration
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.ext.TARGET_JDK_VERSION)
    }
}

idea {
    module {
        downloadSources = false
    }
    project {
        settings {
            delegateActions {
                delegateBuildRunToGradle = false
                testRunner = 'PLATFORM'
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.ext.TARGET_JDK_VERSION
    options.compilerArgs.addAll([
        '-parameters',
        '-Xlint:none',
        '-g'
    ])


    options.fork = true
    options.forkOptions.jvmArgs = ['-Dfile.encoding=UTF-8']
}

configurations {
    microbotRuntime {
        canBeConsumed = false
        canBeResolved = true
    }

    pluginShadowClasspath {
        extendsFrom runtimeClasspath
        exclude group: 'net.runelite', module: 'microbot'
    }

    // Disable source downloads for all configurations
    configureEach {
        resolutionStrategy {
            eachDependency { details ->
                if (details.target.group == 'com.microbot' && details.target.name == 'client') {
                    details.artifactSelection {
                        selectArtifact(DependencyArtifact.DEFAULT_TYPE, null, null)
                    }
                }
            }
        }
    }
}

// Configure dependency caching for local development
configurations.all {
    if (project.hasProperty('useLocalClient') && project.ext.useLocalClient.toString().toBoolean()) {
        // Force refresh of changing modules for local development
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }
}

repositories {
    mavenLocal()
    maven {
        url = project.ext.getNexusNightlyUrl()
    }
    mavenCentral()
}

dependencies {
    // Dynamic dependency resolution based on local configuration
    if (project.hasProperty('useLocalClient') && project.ext.useLocalClient.toString().toBoolean()) {
        // Local development - use locally built client with dynamic versions
        compileOnly 'net.runelite:client:+'
        microbotRuntime 'net.runelite:client:+'
        testImplementation 'net.runelite:client:+'
        logger.lifecycle("🌐 Using REMOTE RuneLite client")
    } else {
        compileOnly 'com.microbot:client:+'
        microbotRuntime 'com.microbot:client:+'
        testImplementation 'com.microbot:client:+'
        logger.lifecycle("🔧 Using LOCAL Microbot client")
        // Remote/CI - use stable RuneLite client        
    }
    
    // Standard test dependencies following RuneLite practices
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
}

application {
    // Replace this with the actual main class inside your shaded jar
    mainClass = 'net.runelite.client.RuneLite'
}

sourceSets.main.java.srcDirs = []
sourceSets.main.resources.srcDirs = []

// Configure standard test task following RuneLite practices
tasks.named('test') {
    useJUnitPlatform()
    
    // Configure test execution
    if (project.hasProperty('testParallelExecution') && project.ext.testParallelExecution.toString().toBoolean()) {
        maxParallelForks = Runtime.runtime.availableProcessors()
    }
    
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.named('compileJava') {
    enabled = false
}
tasks.named('processResources') {
    enabled = false
}
tasks.named('classes') {
    enabled = false
}
tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    enabled = false
}

// Plugin Logic
String pluginVersionFromPluginJson(File pluginDir) {
    def pluginJavaFile = pluginDir.listFiles()?.find { it.name.endsWith("Plugin.java") }
    if (pluginJavaFile == null) {
        throw new GradleException("No *Plugin.java found in: $pluginDir")
    }
    def info = ext.getPluginDescriptorInfo(pluginJavaFile) as Map  // ext == project.ext
    return info.version as String
}

// Discover and filter plugins
afterEvaluate {
    def microbotConfig = configurations.microbotRuntime.resolvedConfiguration
    def microbotDependency = microbotConfig.firstLevelModuleDependencies
            .find { it.moduleGroup == 'com.microbot' && it.moduleName == 'client' }

    if (microbotDependency) {
        logger.lifecycle("🤖 Microbot Client Version: ${microbotDependency.moduleVersion}")
    } else {
        logger.warn("⚠️  Could not determine microbot client version")
    }

    def pluginsDir = file(project.ext.getPluginsSourcePath())
    def allPlugins = project.ext.discoverPlugins(pluginsDir)
    def pluginsProperty = project.findProperty("pluginList")
    def selectedPluginNames = pluginsProperty ? pluginsProperty.split(',').collect { it.trim() } : []

    def validPlugins = allPlugins.findAll { plugin ->
        if (selectedPluginNames && !selectedPluginNames.contains(plugin.name)) {
            logger.info("Skipping plugin: ${plugin.name}")
            return false
        }
        logger.info("Processing plugin: ${plugin.name}")
        return true
    }

    println "Detected plugins: ${allPlugins*.name}"
    println "Processing plugins: ${validPlugins*.name}"

    ext.validPlugins = validPlugins
    ext.allPlugins = allPlugins

    def pluginPublications = []

    validPlugins.each { plugin ->
        // Configure source set
        project.ext.configurePluginSourceSet(plugin)

        // Configure dependencies
        def pluginConfigName = project.ext.configurePluginDependencies(plugin)

        // Create JAR task using the configuration
        def jarTask = tasks.register("${plugin.name}Jar", ShadowJar, project.ext.getPluginJarTaskConfig(plugin, pluginConfigName))

        // Add to build dependencies
        tasks.named("build") {
            dependsOn(jarTask)
        }

        // Collect for publishing
        pluginPublications << [
            name    : plugin.name,
            jarTask : jarTask,
            version : pluginVersionFromPluginJson(plugin.dir)
        ]
    }

    // Configure publishing
    publishing {
        publications {
            pluginPublications.each { pub ->
                create("${pub.name}Publication", MavenPublication) {
                    groupId = project.ext.MAVEN_GROUP_ID
                    artifactId = pub.name.toLowerCase()
                    version = pub.version

                    artifact(pub.jarTask.get().archiveFile) {
                        extension "jar"
                    }
                }
            }
        }
        repositories {
            maven {
                name = "microbot-plugins"
                url = uri(project.ext.getNexusPluginsUrl())
                credentials {
                    username = project.findProperty("nexusUsername") ?: ""
                    password = project.findProperty("nexusPassword") ?: ""
                }
            }
        }
    }

    // Configure test source set to have access to all plugin source sets
    def allPluginCompileTasks = []

    validPlugins.each { plugin ->
        def compileTaskName = "compile${plugin.sourceSetName.capitalize()}Java"

        if (sourceSets.findByName(plugin.sourceSetName)) {
            sourceSets.test.compileClasspath += sourceSets."${plugin.sourceSetName}".output
            sourceSets.test.runtimeClasspath += sourceSets."${plugin.sourceSetName}".output

            allPluginCompileTasks.add(compileTaskName)

            dependencies.add('testRuntimeOnly', sourceSets."${plugin.sourceSetName}".output)
            dependencies.add('testCompileOnly', sourceSets."${plugin.sourceSetName}".output)
        }
    }

    tasks.named('compileTestJava').configure {
        dependsOn allPluginCompileTasks
    }

    tasks.named('test').configure {
        dependsOn allPluginCompileTasks
    }
}

tasks.register("copyPluginDocs") {
    group = "documentation"
    description = "Copies plugin README.md files and resources to the public directory for GitHub Pages"

    doLast {
        def publicDir = file(project.ext.getDocsOutputPath())
        publicDir.mkdirs()

        def pluginsDir = file(project.ext.getPluginsSourcePath())
        def allPlugins = project.ext.discoverPlugins(pluginsDir)
        def pluginsProperty = project.findProperty("pluginList")
        def selectedPluginNames = pluginsProperty ? pluginsProperty.split(',').collect { it.trim() } : []

        def validPlugins = allPlugins.findAll { plugin ->
            if (selectedPluginNames && !selectedPluginNames.contains(plugin.name)) {
                return false
            }
            return true
        }

        validPlugins.each { plugin ->
            project.ext.copyPluginDocumentation(plugin, publicDir)
        }
    }
}

// Validating JDK version when generating plugins.json is important to ensure consistent hashing :(
tasks.register("generatePluginsJson") {
    group = "build"
    description = "Generates plugins.json by scanning plugin folders and hashing JARs"
    dependsOn 'validateJdkVersion'

    doLast {
        def pluginRoot = file(project.ext.getPluginsSourcePath())
        def outputJson = file("${project.ext.getDocsOutputPath()}/plugins.json")
        def jarOutputDir = file("$buildDir/libs")

        def allPlugins = project.ext.discoverPlugins(pluginRoot)
        def plugins = project.ext.generatePluginsJsonData(allPlugins, jarOutputDir)

        outputJson.parentFile.mkdirs()
        outputJson.text = JsonOutput.prettyPrint(JsonOutput.toJson(plugins))
        logger.info("✅ Generated plugins.json with ${plugins.size()} plugins")
    }
}

tasks.register('validateJdkVersion') {
    group = 'verification'
    description = 'Validates that the correct JDK version is being used'

    doLast {
        def currentJdkVersion = System.getProperty('java.version')
        def expectedVersion = project.ext.TARGET_JDK_VERSION

        // Extract major version from full version string (e.g., "11.0.28" -> 11)
        def majorVersion = currentJdkVersion.split('\\.')[0] as Integer

        if (majorVersion != expectedVersion) {
            throw new GradleException(
                "❌ JDK version mismatch!\n" +
                "Expected: JDK ${expectedVersion}\n" +
                "Current:  JDK ${majorVersion} (${currentJdkVersion})\n"
            )
        } else {
            logger.lifecycle("✅ JDK version validated: ${currentJdkVersion}")
        }
    }
}

tasks.register('compileLocalClient') {
    group = 'build'
    description = 'Compiles the local Microbot client using Maven'
    
    doLast {
        def localClientPath = project.findProperty('microbotLocalPath') ?: '../microbot-dev'
        def clientDir = file(localClientPath)
        
        if (!clientDir.exists()) {
            throw new GradleException(
                "❌ Local client directory not found: ${clientDir.absolutePath}\n" +
                "Please set 'microbotLocalPath' property or ensure '../microbot-dev' exists"
            )
        }
        
        logger.lifecycle("🔨 Compiling local Microbot client at: ${clientDir.absolutePath}")
        
        def result = exec {
            workingDir clientDir
            commandLine 'mvn', 'clean', 'install', '-DskipTests'
            ignoreExitValue true
        }
        
        if (result.exitValue != 0) {
            throw new GradleException("❌ Failed to compile local Microbot client")
        }
        
        logger.lifecycle("✅ Local Microbot client compiled successfully")
    }
}

tasks.register('compileAndRun') {
    group = 'application'
    description = 'Compiles the project and runs the Microbot test class with optional recompile flag'
    
    doLast {
        def shouldRecompile = project.hasProperty('recompile') && project.property('recompile').toString().toBoolean()
        def useLocal = project.hasProperty('useLocalClient') && project.ext.useLocalClient.toString().toBoolean()
        
        logger.lifecycle("🚀 Starting compileAndRun task")
        logger.lifecycle("   - Recompile mode: ${shouldRecompile}")
        logger.lifecycle("   - Using local client: ${useLocal}")
        
        if (shouldRecompile && useLocal) {
            logger.lifecycle("🔨 Compiling local client...")
            project.exec {
                workingDir '../microbot-dev'
                commandLine 'mvn', 'clean', 'install', '-DskipTests'
            }
        }
        
        // Run the test class
        logger.lifecycle("▶️  Running Microbot test class...")
        javaexec {
            classpath = configurations.microbotRuntime + configurations.testRuntimeClasspath + sourceSets.test.output
            mainClass = 'net.runelite.client.Microbot'
            workingDir = projectDir
            
            // JVM arguments for better performance and debugging
            jvmArgs = [
                '-Xmx2g',
                '-Xms1g',
                '-Dfile.encoding=UTF-8',
                '-Djava.awt.headless=false'
            ]
            
            // Pass system properties
            systemProperties = [
                'runelite.launcher.nojvm': 'true',
                'runelite.pluginhub.version': 'dev'
            ]
            
            // Handle additional arguments
            if (project.hasProperty('appArgs')) {
                args project.property('appArgs').split(' ')
            }
        }
    }
}

// Handle recompile mode with clean dependency
tasks.register('compileAndRunWithClean') {
    group = 'application'
    description = 'Internal task that handles recompile mode'
    dependsOn 'clean', 'compileAndRun'
}

// Make compileAndRun depend on necessary validation and setup tasks
tasks.named('compileAndRun') {
    dependsOn 'validateJdkVersion', 'build', 'testClasses'
}

tasks.register('quickRun') {
    group = 'application'
    description = 'Quickly runs the Microbot test class without recompiling (unless forced)'
    
    doLast {
        def forceRecompile = project.hasProperty('force') && project.property('force').toString().toBoolean()
        
        if (forceRecompile) {
            logger.lifecycle("🔄 Force recompile requested")
            // Use the clean version when force is requested
            tasks.compileAndRunWithClean.execute()
        } else {
            tasks.compileAndRun.execute()
        }
    }
}